<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">penguin-cloner</title>
  <desc id="desc">Cheerful Linux penguin mascot for cloning and dumping processes</desc>

  <defs>
    <style type="text/css"><![CDATA[
      .bg { fill: #f4f7f5; }
      .ring { fill: none; stroke: #d7e3dc; stroke-width: 10; }
      .body { fill: #1a1f1c; }
      .belly { fill: #ffffff; }
      .beak { fill: #f0a820; }
      .feet { fill: #f0a820; }
      .blush { fill: #ff9e90; opacity: 0.7; }
      .eye-curve { fill: none; stroke: #1a1f1c; stroke-width: 7; stroke-linecap: round; }
      .smile { fill: none; stroke: #1a1f1c; stroke-width: 6; stroke-linecap: round; }
      .proc-back { fill: #9db8ab; }
      .proc-front { fill: #2f6f5e; }
      .proc-line { fill: #d7ebe3; opacity: 0.95; }
      .arrow { fill: none; stroke: #2f6f5e; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .spark { fill: #f0a820; }
      .heart { fill: #ff7a6e; }
      .title { fill: #1a1f1c; font-family: DejaVu Sans, Liberation Sans, Helvetica, Arial, sans-serif; font-size: 42px; font-weight: 700; }
      .subtitle { fill: #4d635a; font-family: DejaVu Sans, Liberation Sans, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 500; }
    ]]></style>
  </defs>

  <rect class="bg" width="640" height="640" rx="72"/>
  <circle cx="320" cy="250" r="168" class="ring"/>

  <!-- optimistic accents -->
  <g class="spark">
    <path d="M468 142 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z"/>
    <path d="M516 188 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" opacity="0.8"/>
  </g>
  <path class="heart" transform="translate(500 148) scale(0.85)" d="M12 21 C12 21 2 14 2 8 C2 4 5 2 8 2 C10 2 12 3.5 12 5 C12 3.5 14 2 16 2 C19 2 22 4 22 8 C22 14 12 21 12 21 Z"/>

  <!-- process cards -->
  <g transform="translate(400 168)">
    <rect class="proc-back" x="18" y="10" width="110" height="78" rx="14"/>
    <rect class="proc-front" x="0" y="24" width="110" height="78" rx="14"/>
    <rect class="proc-line" x="16" y="42" width="78" height="8" rx="4"/>
    <rect class="proc-line" x="16" y="58" width="54" height="8" rx="4"/>
    <rect class="proc-line" x="16" y="74" width="66" height="8" rx="4"/>
  </g>
  <path class="arrow" d="M360 250 H392"/>
  <path class="arrow" d="M382 236 L398 250 L382 264"/>

  <!-- cheerful penguin -->
  <g transform="translate(188 118)">
    <ellipse class="body" cx="96" cy="168" rx="86" ry="108"/>
    <ellipse class="belly" cx="96" cy="186" rx="54" ry="74"/>
    <circle class="body" cx="96" cy="76" r="60"/>
    <ellipse class="belly" cx="96" cy="88" rx="40" ry="36"/>

    <!-- rosy cheeks -->
    <ellipse class="blush" cx="58" cy="100" rx="12" ry="8"/>
    <ellipse class="blush" cx="134" cy="100" rx="12" ry="8"/>

    <!-- happy closed eyes ^_^ -->
    <path class="eye-curve" d="M62 74 Q76 60 90 74"/>
    <path class="eye-curve" d="M102 74 Q116 60 130 74"/>

    <!-- rounded smiling beak -->
    <ellipse class="beak" cx="96" cy="100" rx="20" ry="14"/>

    <!-- big optimistic smile -->
    <path class="smile" d="M68 122 Q96 146 124 122"/>

    <!-- waving left flipper up, right flipper out -->
    <ellipse class="body" cx="8" cy="128" rx="18" ry="46" transform="rotate(-48 8 128)"/>
    <ellipse class="body" cx="184" cy="158" rx="18" ry="44" transform="rotate(28 184 158)"/>

    <ellipse class="feet" cx="64" cy="268" rx="26" ry="11" transform="rotate(-8 64 268)"/>
    <ellipse class="feet" cx="128" cy="268" rx="26" ry="11" transform="rotate(8 128 268)"/>
  </g>

  <text class="title" x="320" y="470" text-anchor="middle">penguin-cloner</text>
  <text class="subtitle" x="320" y="510" text-anchor="middle">Clone &amp; dump Linux processes</text>
</svg>
